name: Deploy to Play Store Internal

on:
  push:
    branches:
      - dev_new

jobs:
  # Runs every unit test before anything is built. The deploy job below `needs`
  # this one, so a single failing scenario stops the release: nothing is built,
  # nothing is signed, nothing reaches Google Play.
  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Same pinned version as the deploy job — tests must run on the Flutter
      # the release is built with.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # `.env` is declared as an asset in pubspec.yaml, so `flutter test` will
      # not start without the file. The tests never read it — they load their
      # own values with `dotenv.testLoad` — so an empty file is enough, and no
      # secret is needed in this job.
      - name: Create placeholder .env
        run: touch .env

      # The exit code is kept rather than failing here, so the summary below is
      # still written when a test fails; the last step fails the job with it.
      - name: Run unit tests with coverage
        id: tests
        run: |
          set +e
          flutter test --coverage --file-reporter json:test-results.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Write test summary
        if: always()
        run: python3 .github/scripts/test_summary.py --lcov coverage/lcov.info --results test-results.json --ledger docs/test-ledger.html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Stop the release if any test failed
        if: steps.tests.outputs.exit_code != '0'
        run: |
          echo "::error::Unit tests failed (exit code ${{ steps.tests.outputs.exit_code }}). Deployment stopped."
          exit 1

  build_and_deploy:
    # Only runs once every unit test has passed.
    needs: unit_tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Pin the Flutter version. With only `channel: stable` the runner picks up
      # whatever stable release is newest that day. That is how this pipeline
      # broke once already: Flutter raised its minimum Gradle, AGP and Kotlin
      # versions, and the build started failing without a single change here.
      #
      # Keep this in sync with the version used for local development, and treat
      # raising it as its own ticket: bump it, build locally first, then push.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # 🔥 توليد ملف الـ .env بالروابط العادية ومفاتيح السيكرتس بأمان
      #
      # Only public URLs are written here as plain text. Every credential comes
      # from a repository secret (Settings -> Secrets and variables -> Actions).
      # A value pasted here would be readable by anyone who can see the repo,
      # and would stay in git history even after it is removed.
      - name: Create .env file dynamically
        run: |
          cat <<'EOF' > .env
          SENTRY_DNS="${{ secrets.SENTRY_DNS }}"
          SMART_LOOK_KEY="${{ secrets.SMART_LOOK_KEY }}"
          MARKET_URL="https://trydos_develop.ramaaz.dev/"
          MARKETGo_URL="https://trydosv2.ramaaz.dev/"
          STORY_URL="https://trydo_story.ramaaz.dev"
          CHAT_NEST_URL="https://trydoschatnest.ramaaz.dev"
          ELASTIC_URL="https://recomende_elasticsearch_engin_staging.ramaaz.dev"
          WEB_CALLS_URL="https://trydos.ramaaz.dev"
          WALLET_URL="https://rdb-develop.ramaaz.dev"
          WEB_CALLS_NEST_URL="https://trydos-front-git-new-chat-nestjs-backend-trydos-front-team.vercel.app"
          WEB_APP="https://trydos.ramaaz.dev"
          CLOUDINARY_URL="https://api.cloudinary.com"
          CLOUDINARY_NAME="djooohujg"
          CLOUDINARY_VERSION="v1_1"
          CLOUDINARY_LOAD_PRESET="v4h8xqns"
          Images_Url="https://res.cloudinary.com/dtcmozf4d/image/upload/v1"
          Video_url="https://res.cloudinary.com/dtcmozf4d/video/upload/v1/product/videos/"
          COMMENT_TOKEN_URL="https://trydos_comments_develop.ramaaz.dev/"
          MEDIA_SERVER_URL="https://media_server.ramaaz.dev/"
          MEDIA_API_KEY="${{ secrets.MEDIA_API_KEY }}"
          Media_S3_Server="https://media_server.ramaaz.dev/image/upload"
          Vedio_S3_Server="https://media_server.ramaaz.dev/video/upload"
          Gemini="${{ secrets.GEMINI_KEY }}"
          Public_Api_Key="${{ secrets.STRIPE_PUBLIC_KEY }}"
          Secret_Key="${{ secrets.STRIPE_SECRET_KEY }}"
          EOF

      # 🛠️ فك تشفير المفتاح داخل مجلد build مباشرة لحل مشكلة "Keystore not found"
      - name: Decode Keystore
        run: |
          mkdir -p build
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > build/upload-keystore.jks

      # 7. بناء التطبيق وتمرير أرقام الإصدارات مع المسار الجديد للمفتاح
      - name: Build App Bundle
        env:
          ANDROID_KEYSTORE_PATH: "build/upload-keystore.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_NUM=$((${{ github.run_number }} + 7))
          flutter build appbundle --release --build-number=$BUILD_NUM

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.trydos.www
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
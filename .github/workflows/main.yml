name: Copilot Review Trigger

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copilot Review
        run: |
          echo "Requesting Copilot to review this PR based on .github/copilot-instructions.md"

##############################################################################
# Trydos — custom Semgrep rule pack
#
# Run:  semgrep --config .semgrep/trydos-rules.yml --metrics=off
#
# Scope: Flutter/Dart source under lib/, plus Android/iOS config files.
# Generated build output is excluded by .semgrepignore.
#
# Rule id prefixes:
#   trydos-sec-*   security
#   trydos-arch-*  project architecture rules (CLAUDE.md / ADRs)
#   trydos-qa-*    code quality that can hide runtime failures
#
# NOTE: every `pattern-regex` value is kept on ONE line on purpose. YAML folded
# scalars (`>-`) would insert spaces into the regex and change its meaning.
##############################################################################

rules:

  # -------------------------------------------------------------------------
  # SECURITY — secrets
  # -------------------------------------------------------------------------

  - id: trydos-sec-hardcoded-secret
    languages: [generic]
    severity: ERROR
    message: >-
      A secret looks hard-coded in source. Move it to .env and read it through
      dotenv, so the value never ships inside the APK/IPA in plain text.
    paths:
      include:
        - "/lib/**/*.dart"
        - "/android/**/*.kt"
        - "/android/**/*.java"
        - "/android/**/*.gradle"
        - "/android/**/*.gradle.kts"
      exclude:
        # Generated by the FlutterFire CLI — see the note on
        # trydos-sec-google-api-key below.
        - "/lib/firebase_options.dart"
    patterns:
      - pattern-regex: '(?i)\b(api[_-]?key|apikey|secret[_-]?key|client[_-]?secret|access[_-]?token|auth[_-]?token|private[_-]?key|app[_-]?secret|agora[_-]?app[_-]?id|agora[_-]?certificate|pusher[_-]?key|pusher[_-]?secret|password)\b\s*[:=]\s*[''"][^''"\s$]{12,}[''"]'
      - pattern-not-regex: '(?i)[''"](YOUR_|TODO|CHANGE_ME|EXAMPLE|xxxx|<)'

  - id: trydos-sec-hardcoded-jwt
    languages: [generic]
    severity: ERROR
    message: >-
      A JWT literal is committed in source. A token belongs to a live session
      and must never be checked in. Revoke it and load tokens at runtime.
    paths:
      include:
        - "/lib/**/*.dart"
        - "/test/**/*.dart"
    pattern-regex: '[''"]eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}[''"]'

  - id: trydos-sec-google-api-key
    languages: [generic]
    severity: WARNING
    message: >-
      A Google/Firebase API key literal is in source. Restrict it by package
      name + SHA-1 in the Google Cloud console, or keep it out of the repo.
    paths:
      include:
        - "/lib/**/*.dart"
        - "/android/**/*.kt"
        - "/android/**/*.java"
      exclude:
        # Written by the FlutterFire CLI. A Firebase Web API key is meant to
        # ship inside the app; it is an identifier, not a secret. A `nosemgrep`
        # comment would be wiped the next time the file is regenerated, so the
        # exception lives here instead. The control is in the Google Cloud
        # console: restrict the key by package name + SHA-1.
        - "/lib/firebase_options.dart"
    pattern-regex: '[''"]AIza[0-9A-Za-z_-]{35}[''"]'

  # -------------------------------------------------------------------------
  # SECURITY — transport
  # -------------------------------------------------------------------------

  - id: trydos-sec-cleartext-http-url
    languages: [generic]
    severity: ERROR
    message: >-
      Plain http:// endpoint. The traffic can be read and changed on the wire.
      Use https://. If this is a local dev host, allow it in
      android/app/src/main/res/xml/network_security_config.xml instead.
    paths:
      include:
        - "/lib/**/*.dart"
    patterns:
      - pattern-regex: '[''"]http://[A-Za-z0-9_.-]+'
      - pattern-not-regex: '[''"]http://(localhost|127\.0\.0\.1|10\.0\.2\.2|0\.0\.0\.0)'
      - pattern-not-regex: '[''"]http://(www\.)?(w3\.org|schemas\.|xmlns)'

  - id: trydos-sec-tls-verification-disabled
    languages: [generic]
    severity: ERROR
    message: >-
      TLS certificate checking is being turned off. Every HTTPS call then
      accepts any certificate, which allows a man-in-the-middle. Never ship
      this, not even behind a debug flag.
    paths:
      include:
        - "/lib/**/*.dart"
    pattern-regex: '(badCertificateCallback|onBadCertificate)[^;\n]{0,120}=>\s*true|allowsArbitraryLoads\s*[:=]\s*true'

  - id: trydos-sec-android-cleartext-enabled
    languages: [generic]
    severity: ERROR
    message: >-
      Cleartext HTTP is enabled app-wide. Set it to false and allow single dev
      hosts through network_security_config.xml only.
    paths:
      include:
        - "/android/**/AndroidManifest.xml"
        - "/android/**/network_security_config.xml"
    pattern-regex: '(android:usesCleartextTraffic|cleartextTrafficPermitted)\s*=\s*"true"'

  - id: trydos-sec-ios-ats-disabled
    languages: [generic]
    severity: ERROR
    message: >-
      App Transport Security is disabled in Info.plist, which allows plain HTTP
      for every iOS request. Remove NSAllowsArbitraryLoads.
    paths:
      include:
        - "/ios/**/Info.plist"
        - "/macos/**/Info.plist"
    pattern-regex: '<key>NSAllowsArbitraryLoads(InWebContent)?</key>\s*<true\s*/>'

  # -------------------------------------------------------------------------
  # SECURITY — webview (calls run Agora inside a webview)
  # -------------------------------------------------------------------------

  - id: trydos-sec-webview-file-access
    languages: [generic]
    severity: ERROR
    message: >-
      The webview may read local files from a file:// page. Remote content in
      that webview could then read app-private files. Keep
      allowFileAccessFromFileURLs / allowUniversalAccessFromFileURLs false.
    paths:
      include:
        - "/lib/**/*.dart"
        - "/android/**/*.kt"
        - "/android/**/*.java"
    pattern-regex: '(setAllowFileAccessFromFileURLs|setAllowUniversalAccessFromFileURLs|allowFileAccessFromFileURLs|allowUniversalAccessFromFileURLs)\s*[:(=]\s*true'

  - id: trydos-sec-webview-js-string-interpolation
    languages: [generic]
    severity: WARNING
    message: >-
      Dart values are pasted into JavaScript source. If any value comes from the
      server or the user this is script injection inside the webview. Pass the
      value through jsonEncode(), or use a JavaScript channel.
    paths:
      include:
        - "/lib/**/*.dart"
    patterns:
      - pattern-regex: '(runJavaScript|runJavascript|evaluateJavascript|evaluateJavaScript|callAsyncJavaScript)[^;\n]{0,200}\$\{?[A-Za-z_]'
      - pattern-not-regex: 'jsonEncode'

  # -------------------------------------------------------------------------
  # SECURITY — logging and storage of session data
  # -------------------------------------------------------------------------

  - id: trydos-sec-logs-sensitive-value
    languages: [generic]
    severity: WARNING
    message: >-
      A token / password / OTP value is written to the log. Device logs can be
      read by other tooling and are picked up by crash reporters. Log an id or
      a boolean, never the value.
    paths:
      include:
        - "/lib/**/*.dart"
    pattern-regex: '(?i)\b(print|debugPrint|devLog|developer\.log|logger\.[a-z]+)\s*\([^;]{0,200}?\b(token|password|otp|refreshToken|accessToken|authorization|bearer|pinCode|secret)\b'

  - id: trydos-sec-print-in-production-code
    languages: [generic]
    severity: INFO
    message: >-
      print() stays in the release build and writes to the device log. Use the
      project logger, or guard it with kDebugMode, so release builds stay quiet.
    paths:
      include:
        - "/lib/**/*.dart"
    pattern-regex: '(?m)^[ \t]*print\s*\('

  - id: trydos-sec-plain-prefs-for-credentials
    languages: [generic]
    severity: WARNING
    message: >-
      Credentials are stored in SharedPreferences, which is plain text on a
      rooted or jailbroken device. Use flutter_secure_storage for the token and
      the refresh token.
    paths:
      include:
        - "/lib/**/*.dart"
    pattern-regex: '(?i)(prefs|sharedPreferences|_prefs|preferences)\s*[.?!]{0,2}\s*setString\s*\([^;)\n]{0,120}\b(token|password|refresh|secret|credential)\b'

  # -------------------------------------------------------------------------
  # SECURITY — injection and weak randomness
  # -------------------------------------------------------------------------

  - id: trydos-sec-weak-random-for-security-value
    languages: [generic]
    severity: WARNING
    message: >-
      Random() is predictable. For a value that must be unguessable (OTP, nonce,
      token, salt, session id) use Random.secure().
    paths:
      include:
        - "/lib/**/*.dart"
    patterns:
      - pattern-regex: '(?i)\b(otp|nonce|token|salt|sessionId|verificationCode)[A-Za-z0-9_]*\s*=\s*[^;\n]{0,80}\bRandom\s*\(\s*\)'
      - pattern-not-regex: 'Random\.secure'

  - id: trydos-sec-process-command-injection
    languages: [generic]
    severity: ERROR
    message: >-
      A shell command is built by string interpolation. If any part comes from
      outside the app this runs attacker-chosen commands. Pass the arguments as
      a list instead.
    paths:
      include:
        - "/lib/**/*.dart"
        - "/tool/**/*.dart"
    pattern-regex: 'Process\.(runSync|startSync|run|start)\s*\(\s*[^,)\n]*\$\{?[A-Za-z_]'

  - id: trydos-sec-path-from-interpolation
    languages: [generic]
    severity: INFO
    message: >-
      A file path is built from an interpolated value. If it can contain "../"
      the app reads or writes outside its own sandbox. Sanitise the segment
      (p.basename) before joining.
    paths:
      include:
        - "/lib/**/*.dart"
    patterns:
      - pattern-regex: 'File\s*\(\s*[''"][^''"\n]*\$\{?[A-Za-z_]'
      - pattern-not-regex: 'basename'

  # -------------------------------------------------------------------------
  # ARCHITECTURE — rules from CLAUDE.md and the project's ADRs
  # -------------------------------------------------------------------------

  - id: trydos-arch-appwide-bloc-created-inline
    languages: [generic]
    severity: ERROR
    message: >-
      An app-wide BLoC is provided with `create:`, so BlocProvider owns it and
      closes the DI singleton when this widget is disposed. Every later screen
      then gets a closed BLoC. Use BlocProvider.value(value: getIt<...>()).
    paths:
      include:
        - "/lib/**/*.dart"
    pattern-regex: 'BlocProvider\s*(<[^>\n]{0,80}>)?\s*\(\s*create\s*:\s*\([^)\n]*\)\s*=>\s*(getIt|sl|di|locator|GetIt\.)'

  - id: trydos-arch-hand-edited-generated-file
    languages: [generic]
    severity: WARNING
    message: >-
      This looks like hand-written code inside a generated file. Generated files
      are rebuilt by gen.sh / keys.sh and the edit will be lost. Change the
      source instead.
    paths:
      include:
        - "/lib/**/*.g.dart"
        - "/lib/**/*.config.dart"
    pattern-regex: '(?i)//\s*(TODO|FIXME|HACK|manual edit|do not regenerate)'

  - id: trydos-arch-hardcoded-user-facing-string
    languages: [generic]
    severity: INFO
    message: >-
      A user-facing string is hard-coded in a widget. The app ships ar-SY,
      en-US, ku-IQ and tr-TR — use LocaleKeys.<key>.tr() so the text is
      translated and the RTL layout stays correct.
    paths:
      include:
        - "/lib/features/**/presentation/**/*.dart"
    # `(?![ \t]*//)` keeps commented-out code out: a string inside a comment is
    # not shown to anyone, so it is not a translation problem.
    pattern-regex: '(?m)^(?![ \t]*//)[^\n]*?\bText\s*\(\s*[''"][A-Za-z][A-Za-z ,.!?''-]{8,}[''"]\s*[,)]'

  - id: trydos-arch-hydrated-state-required-field
    languages: [generic]
    severity: WARNING
    message: >-
      A required, non-nullable field is declared in a hydrated BLoC state.
      Payloads already stored on user devices do not carry a newly added field,
      so fromJson throws on the next app start. Give it a default value or make
      it nullable, and keep a migration path.
    paths:
      include:
        - "/lib/**/*_state.dart"
    pattern-regex: '(?m)^[ \t]*required\s+[A-Z][A-Za-z0-9_<>, ]*[A-Za-z0-9_>]\s+[a-z][A-Za-z0-9_]*\s*[,;]'

  # -------------------------------------------------------------------------
  # QUALITY — patterns that hide runtime failures
  # -------------------------------------------------------------------------

  - id: trydos-qa-empty-catch-block
    languages: [generic]
    severity: WARNING
    message: >-
      The error is caught and thrown away. A failure here becomes an empty
      screen with no signal. Log it, report it to Sentry, or handle it.
    paths:
      include:
        - "/lib/**/*.dart"
    pattern-regex: 'catch\s*\([^)\n]*\)\s*\{\s*\}'

  - id: trydos-qa-swallowed-async-error
    languages: [generic]
    severity: INFO
    message: >-
      .catchError / .onError returns a placeholder value and hides the failure.
      Make sure the caller can still tell that the call failed.
    paths:
      include:
        - "/lib/**/*.dart"
    pattern-regex: '\.(catchError|onError)\s*\(\s*\([^)\n]*\)\s*(async\s*)?=>\s*(null|\{\}|\[\]|false|0)\s*[,)]'

  - id: trydos-qa-force-unwrap-on-network-json
    languages: [generic]
    severity: INFO
    message: >-
      A JSON field is force-unwrapped with `!` and nothing checks it for null
      first. If the backend ever omits the field the app crashes. Guard it with
      `json["x"] == null ? ... : ...`, or use a default.
    paths:
      include:
        - "/lib/**/data/**/*.dart"
        - "/lib/**/*_model.dart"
      exclude:
        - "/lib/**/*.g.dart"
    patterns:
      # Match from the start of the `field:` line through the `!`, so the guard
      # (which sits between the two) is inside the matched text and the
      # pattern-not-regex below can see it. `(?!=)` keeps `json["x"] != null`
      # out — that is a comparison, not a force-unwrap.
      - pattern-regex: '(?m)^[ \t]*[A-Za-z_]\w*\s*:[^;]{0,400}?\bjson\s*\[\s*([''"])\w+\1\s*\]\s*!(?!=)'
      - pattern-not-regex: '(==|!=)\s*null'
      - pattern-not-regex: 'containsKey'

  - id: trydos-qa-debug-flag-left-on
    languages: [generic]
    severity: WARNING
    message: >-
      A debug or mock switch is hard-coded to true, so it is on in the release
      build too.
    paths:
      include:
        - "/lib/**/*.dart"
    pattern-regex: '(?i)\b(isDebug|debugMode|enableDebugging|enableLogging|showDebug|useMock|mockMode|bypassAuth|skipAuth)\s*[:=]\s*true\b'

  - id: trydos-qa-android-debuggable
    languages: [generic]
    severity: ERROR
    message: >-
      android:debuggable is set in the manifest. A debuggable release build lets
      anyone attach a debugger and read app memory. Remove it.
    paths:
      include:
        - "/android/**/AndroidManifest.xml"
    pattern-regex: 'android:debuggable\s*=\s*"true"'

  - id: trydos-qa-android-backup-allowed
    languages: [generic]
    severity: WARNING
    message: >-
      allowBackup is true, so `adb backup` can pull SharedPreferences — the
      session token included — off a device that has USB debugging on.
    paths:
      include:
        - "/android/**/AndroidManifest.xml"
    pattern-regex: 'android:allowBackup\s*=\s*"true"'

##############################################################################
# Trydos — gitleaks configuration
#
# Working tree:  gitleaks dir . --config .gitleaks.toml
# Git history:   gitleaks git . --config .gitleaks.toml
#
# The default gitleaks rule pack stays on (see [extend]). The rules below add
# the credential shapes this project actually uses, which the default pack does
# not know about.
##############################################################################

title = "Trydos secret scanning"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Files that must never be committed
# ---------------------------------------------------------------------------

[[rules]]
id = "trydos-dotenv-committed"
description = "A .env file is in the repository. Every backend URL and key the app uses lives in this file; it must stay out of git."
path = '''(^|/)\.env(\.[A-Za-z0-9_-]+)?$'''
tags = ["trydos", "secret-file"]

[[rules]]
id = "trydos-keystore-committed"
description = "An Android signing keystore is in the repository. Whoever has it can sign a build as Trydos."
path = '''(^|/)[^/]+\.(jks|keystore|p12|pfx)$'''
tags = ["trydos", "secret-file", "android"]

[[rules]]
id = "trydos-key-properties-committed"
description = "android/key.properties holds the keystore and key passwords."
path = '''(^|/)key\.properties$'''
tags = ["trydos", "secret-file", "android"]

# ---------------------------------------------------------------------------
# Credential shapes used by this project
# ---------------------------------------------------------------------------

[[rules]]
id = "trydos-payment-live-key"
description = "A live payment key (pk_live_/sk_live_). The secret half can move money."
regex = '''\b(pk|sk)_live_[0-9a-zA-Z]{32,}'''
keywords = ["pk_live_", "sk_live_"]
tags = ["trydos", "payment"]

[[rules]]
id = "trydos-sentry-dsn"
description = "A Sentry DSN. Anyone holding it can push fake events into the project and burn its quota."
regex = '''https://[0-9a-f]{32}@[A-Za-z0-9.-]*ingest[A-Za-z0-9.-]*\.sentry\.io/[0-9]+'''
keywords = ["sentry.io"]
tags = ["trydos", "telemetry"]

[[rules]]
id = "trydos-agora-app-id"
description = "An Agora App ID written into source. Calls run on Agora; the App ID belongs in .env."
regex = '''(?i)agora[_-]?(app[_-]?id|certificate)\s*[:=]\s*["'][0-9a-f]{32}["']'''
keywords = ["agora"]
tags = ["trydos", "calls"]

[[rules]]
id = "trydos-pusher-credential"
description = "A Pusher key or secret. Pusher carries the chat channels."
regex = '''(?i)(pusher[_-]?(key|secret)|apiKey)\s*[:=]\s*["'][0-9a-f]{20}["']'''
keywords = ["pusher", "apikey"]
tags = ["trydos", "chat"]

[[rules]]
id = "trydos-smartlook-key"
description = "A SmartLook session-replay key. Session replay records real user screens."
regex = '''(?i)smart[_-]?look[_-]?key\s*=\s*["']?[0-9a-f]{32,}'''
keywords = ["smartlook", "smart_look"]
tags = ["trydos", "telemetry"]

[[rules]]
id = "trydos-media-server-key"
description = "The media-server API key. It authorises uploads to the media server."
regex = '''(?i)media[_-]?api[_-]?key\s*=\s*["']?[A-Za-z0-9+/=]{20,}'''
keywords = ["media_api_key", "mediaapikey"]
tags = ["trydos", "media"]

[[rules]]
id = "trydos-cloudinary-credentials"
description = "A Cloudinary URL carrying the API key and secret."
regex = '''cloudinary://[0-9]{10,}:[A-Za-z0-9_-]{20,}@'''
keywords = ["cloudinary://"]
tags = ["trydos", "media"]

[[rules]]
id = "trydos-hardcoded-bearer"
description = "A Bearer token written into source. A token belongs to one live session."
regex = '''["']Bearer\s+[A-Za-z0-9._~+/=-]{24,}["']'''
keywords = ["bearer"]
tags = ["trydos", "auth"]

[[rules]]
id = "trydos-android-signing-password"
description = "A signing password in a Gradle file."
regex = '''(?i)(storePassword|keyPassword|storeFile|keyAlias)\s*[=:]\s*["'][^"'\n$]{6,}["']'''
keywords = ["storepassword", "keypassword", "keyalias"]
tags = ["trydos", "android"]

# ---------------------------------------------------------------------------
# Allowlist
# ---------------------------------------------------------------------------

[[allowlists]]
description = """
Google/Firebase client config generated by the FlutterFire CLI and the Firebase
console. These keys are meant to ship inside the app — they identify the app,
they do not authorise anything on their own. The control is in the Google Cloud
console: restrict each key by package name + SHA-1. Do not add anything else to
this list without writing down why.
"""
paths = [
  '''(^|/)lib/firebase_options\.dart$''',
  '''(^|/)android/app/google-services\.json$''',
  '''(^|/)ios/Runner/GoogleService-Info\.plist$''',
  '''(^|/)macos/Runner/GoogleService-Info\.plist$''',
]

[[allowlists]]
targetRules = ["gcp-api-key"]
description = """
The Google Maps client key. It is compiled into the APK and the IPA, so hiding
it from the repository changes nothing — anyone can read it out of a released
build. The real control is a restriction in the Google Cloud console:
  - Android key: restrict by package name + SHA-1 certificate fingerprint
  - iOS key:     restrict by bundle ID
  - both:        restrict to the Maps APIs the app actually calls
Without those restrictions the key can be used by anyone and billed to us.
Only these two files are allowed; a Google key anywhere else still fails.
"""
paths = [
  '''(^|/)android/app/src/main/AndroidManifest\.xml$''',
  '''(^|/)ios/Runner/AppDelegate\.swift$''',
]

[[allowlists]]
description = "Build output, dependency caches and coverage reports are not source."
paths = [
  '''(^|/)build/''',
  '''(^|/)\.dart_tool/''',
  '''(^|/)ios/Pods/''',
  '''(^|/)coverage/''',
  '''\.lock$''',
]

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.example.trydos"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    // كان `lintOptions` — محذوفة في AGP 9، والبديل هو `lint`
    lint {
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility  JavaVersion.VERSION_17
        targetCompatibility  JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId = "com.trydos.www"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        
        // هنا يتم استقبال أرقام الإصدارات الممررة ديناميكياً من سيرفر GitHub
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        testInstrumentationRunner "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: "true"
    }

    testOptions {
        execution "ANDROIDX_TEST_ORCHESTRATOR"
    }

    signingConfigs {
        release {
            // القراءة مباشرة من متغيرات السيرفر السحابي لضمان الأمان والرفع التلقائي السليم
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "upload"
            keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "TrydosFlutterAppH12345"
            // كان `file("${project.buildDir}/../upload-keystore.jks")` — و
            // project.buildDir محذوفة في Gradle 9. المسار الناتج لم يتغيّر:
            // <repo>/build/upload-keystore.jks — وهو ما ينتجه Decode Keystore في CI
            storeFile rootProject.file("../build/upload-keystore.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "TrydosFlutterAppH12345"
        }
    }

    buildTypes {
        release {
            // R8 مُفعَّل: تصغير وتعتيم كود Java/Kotlin. القواعد في proguard-rules.pro
            minifyEnabled true

            // يبقى معطّلاً عمداً: تُشار إلى موارد أصلية بالاسم من Dart فيحذفها
            // تصغير الموارد — أيقونة الإشعار res/drawable/app_icon.png
            // (AndroidInitializationSettings('app_icon')) ونغمات res/raw/ringtone1.mp3
            // و res/raw/whats.mp3. تفعيله يتطلّب res/raw/keep.xml يستثنيها أولاً.
            shrinkResources false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // التوقيع التلقائي باستخدام الإعدادات السحابية المحددة بالأعلى
            signingConfig signingConfigs.release
        }
    }
}

// كان `kotlinOptions` داخل `android {}` — مهجورة في Kotlin 2.x.
// البديل هو امتداد kotlin على مستوى المشروع.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

flutter {
    source = "../.."
}

dependencies {
    androidTestUtil "androidx.test:orchestrator:1.4.2"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.3.20"
    implementation "com.google.android.material:material:1.12.0"
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
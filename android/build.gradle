buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// مجلد البناء موحّد في جذر المستودع (وليس داخل android/).
// كان `rootProject.buildDir = '../build'` — وهي واجهة محذوفة في Gradle 9.
// البديل هو layout.buildDirectory، والمسار الناتج هو نفسه: <repo>/build
def sharedBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(sharedBuildDir)

// تجميع كل إعدادات المشاريع الفرعية والمكتبات في مكان واحد منظم
subprojects { project ->
    // كان `project.buildDir = "${rootProject.buildDir}/${project.name}"`
    project.layout.buildDirectory.value(sharedBuildDir.dir(project.name))

    afterEvaluate {
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {

            project.android {
                compileSdk 36
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }

                // 🔥 الحل السحري: إذا كانت المكتبة قديمة ولا تملك namespace، يتم تعيينه لها تلقائيًا هنا لمنع خطأ البناء
                if (project.android.hasProperty("namespace") && project.android.namespace == null) {
                    project.android.namespace = project.group
                }
            }

            // كان `kotlinOptions { jvmTarget = "17" }` — مهجورة في Kotlin 2.x
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions {
                    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                }
            }
        }
    }
}

// posthog_flutter 5.30.0 يطلب `com.posthog:posthog-android:[3.51.0,4.0.0]`،
// ومداه يشمل طرفَه الأعلى. وقد صدرت 4.0.0 وهي إصدارٌ قاطع: حُذفت منها
// `PostHogOnFeatureFlags` و`RRStyle` و`getFeatureFlagPayload`، وكودُ الإضافة
// ينادي الثلاثة — فلا تُترجَم، ويسقط البناءُ عند
// `:posthog_flutter:compileDebugKotlin`.
//
// فيُحبس الجزءُ الأصليُّ تحت 4، وهو ما أراده صاحبُ الإضافة بمداه. ويُرفع هذا
// حين تُصدر الإضافةُ نسخةً تُترجَم على 4.x.
subprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.posthog' &&
                    details.requested.name == 'posthog-android') {
                details.useVersion '[3.51.0,4.0.0)'
                details.because 'posthog_flutter 5.30.0 does not compile ' +
                        'against posthog-android 4.x'
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
